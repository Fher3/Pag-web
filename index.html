<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0610">
<title>Para Monchis ♥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,500;1,500;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --rosa:#ff5d8f; --rosa2:#ff9bb8; --crema:#fff7ec; --papel:#fffaf0;
  --script:'Dancing Script','Brush Script MT',cursive;
  --serif:'Playfair Display',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0a0610;color:#fff;font-family:var(--serif);-webkit-tap-highlight-color:transparent}
canvas#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}

/* ═════════ PANTALLA 1: LA CARTA ═════════ */
#intro{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 30%,#3a1230 0%,#1b0a1f 55%,#0a0610 100%);
  transition:opacity 1.4s ease, background 1.4s ease}
#intro.negro{background:#000;opacity:0;pointer-events:none}
.scene{perspective:1200px;transition:transform 1.6s cubic-bezier(.6,0,.3,1), opacity 1s;padding:20px}
.scene.zoom{transform:scale(3.2) translateY(14%);opacity:0}
.env{position:relative;width:min(88vw,440px);aspect-ratio:1.5;filter:drop-shadow(0 30px 40px rgba(0,0,0,.55));
  animation:flota 4s ease-in-out infinite}
.env.abierta{animation:none}
@keyframes flota{50%{transform:translateY(-10px) rotate(-.6deg)}}
.env .atras{position:absolute;inset:0;background:linear-gradient(160deg,#e9c9a3,#d9aa7c);border-radius:10px}
.env .carta{position:absolute;left:7%;right:7%;top:6%;bottom:6%;background:
   repeating-linear-gradient(transparent 0 27px,rgba(200,150,150,.18) 27px 28px),var(--papel);
  border-radius:6px;padding:18px 20px;color:#7a2a45;text-align:center;
  transition:transform 1.1s cubic-bezier(.3,.9,.3,1) .7s;z-index:1;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.env.abierta .carta{transform:translateY(-58%) scale(1.04)}
.carta h2{font-family:var(--script);font-size:clamp(30px,8vw,46px);line-height:1.1}
.carta p{font-family:var(--serif);font-style:italic;font-size:clamp(13px,3.5vw,17px);margin-top:6px;color:#9b4a62}
.carta .corazon{font-size:28px;margin-top:6px;display:block;animation:latido 1s infinite}
.env .frente{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(135deg,#f0d3ae,#e0b788);
  clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);border-radius:10px}
.env .lado{position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:10px;
  background:linear-gradient(160deg,#ecc9a0,#d6a173);clip-path:polygon(0 0,52% 52%,0 100%)}
.env .lado.der{background:linear-gradient(200deg,#ecc9a0,#d6a173);clip-path:polygon(100% 0,48% 52%,100% 100%)}
.env .tapa{position:absolute;left:0;right:0;top:0;height:58%;z-index:3;transform-origin:top;
  background:linear-gradient(180deg,#f6dcb9,#e7bf93);clip-path:polygon(0 0,100% 0,50% 100%);
  transition:transform .9s cubic-bezier(.5,0,.2,1), z-index 0s .45s}
.env.abierta .tapa{transform:rotateX(180deg);z-index:0}
.sello{position:absolute;left:50%;top:50%;width:54px;height:54px;transform:translate(-50%,-50%);z-index:4;
  border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff7a9d,#c2183f 70%);display:flex;align-items:center;
  justify-content:center;font-size:26px;box-shadow:0 4px 10px rgba(0,0,0,.4),inset 0 -3px 6px rgba(0,0,0,.25);
  transition:opacity .4s, transform .6s;animation:latido 1.4s infinite}
.env.abierta .sello{opacity:0;transform:translate(-50%,-50%) scale(.2)}
@keyframes latido{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.12)}}
.carta .corazon{animation:latido2 1s infinite}
@keyframes latido2{50%{transform:scale(1.25)}}
#btnAbrir{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);z-index:5;cursor:pointer;
  font-family:var(--script);font-weight:700;font-size:clamp(19px,5.2vw,26px);color:#fff;white-space:nowrap;
  padding:10px 26px;border:none;border-radius:50px;background:linear-gradient(135deg,#ff6b9a,#d81b60);
  box-shadow:0 8px 22px rgba(216,27,96,.55),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .2s, opacity .4s}
#btnAbrir:hover{transform:translateX(-50%) scale(1.07)}
#btnAbrir:active{transform:translateX(-50%) scale(.96)}
#btnAbrir::after{content:"";position:absolute;inset:-6px;border-radius:50px;border:2px solid var(--rosa2);
  animation:onda 1.8s infinite;opacity:0}
@keyframes onda{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.25);opacity:0}}
.env.abierta #btnAbrir{opacity:0;pointer-events:none}

/* ═════════ PANTALLA 2: NEGRO + VENTANAS ═════════ */
#stage{position:fixed;inset:0;z-index:2;background:transparent;opacity:0;transition:opacity 1.5s;overflow:hidden}
#stage.on{opacity:1}
#ventanas{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:10px}

.win{position:absolute;left:50%;top:50%;
  width:min(96vw,920px);border-radius:14px;overflow:hidden;
  background:linear-gradient(180deg,#fffaf3,#f3ebde);color:#2d1b26;
  box-shadow:0 0 0 1px rgba(255,255,255,.6) inset,0 30px 80px rgba(0,0,0,.7),0 0 70px rgba(255,93,143,.35);
  --dx:0px;--dy:0px;--rot:0deg;
  transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) rotate(var(--rot));
  animation:entra .75s cubic-bezier(.2,1.3,.4,1) both}
.win.sale{animation:sale .45s cubic-bezier(.6,0,.9,.4) forwards}
@keyframes entra{
  0%{opacity:0;transform:translate(-50%,-50%) translate(var(--dx),calc(var(--dy) + 60px)) rotate(calc(var(--rot) - 6deg)) scale(.55)}
  100%{opacity:1;transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1)}}
@keyframes sale{
  to{opacity:0;transform:translate(-50%,-50%) translate(var(--dx),calc(var(--dy) - 40px)) rotate(calc(var(--rot) + 5deg)) scale(.7)}}
.titulo{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;
  background:linear-gradient(90deg,#ff7fa6,#ff5d8f);color:#fff;font:600 15px/1 var(--serif);letter-spacing:.5px}
.titulo .x{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-style:normal}
.titulo .cont{opacity:.8;font-size:12px;margin-right:auto;margin-left:12px}
.cuerpo{display:flex;align-items:center;gap:clamp(12px,3vw,32px);padding:clamp(12px,2.5vw,26px)}
.cuerpo .gifbox{flex:0 0 auto;width:min(480px,46%);aspect-ratio:480/362;border-radius:10px;overflow:hidden;
  background:#fff;box-shadow:0 8px 24px rgba(180,60,100,.3)}
.cuerpo img{width:100%;height:100%;object-fit:contain;display:block}
.texto{flex:1;font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(20px,3.3vw,34px);line-height:1.3;color:#4a1630}
.texto span{display:inline-block;opacity:0;transform:translateY(14px);filter:blur(4px);
  animation:palabra .6s ease forwards}
@keyframes palabra{to{opacity:1;transform:none;filter:none}}
.pie{display:flex;justify-content:center;padding:0 0 clamp(12px,2vw,20px)}
.ok{font:700 16px var(--serif);padding:8px 38px;border-radius:8px;border:1px solid #b9a9a0;
  background:linear-gradient(#fff,#e9e0d6);color:#333;box-shadow:0 2px 0 #cbbdb2;transition:transform .12s}
.ok.pulsa{transform:translateY(2px) scale(.96);background:linear-gradient(#ffd3e1,#ffb0c9);box-shadow:none}

@media (max-width:640px){
  .cuerpo{flex-direction:column;text-align:center}
  .cuerpo .gifbox{width:100%}
}

/* controles */
#controles{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:12px;opacity:0;transition:opacity 1s}
#controles.on{opacity:1}
#controles button{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.08);color:#fff;font-size:15px;cursor:pointer;backdrop-filter:blur(6px)}
#barra{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}
#barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rosa2),var(--rosa))}

/* final */
#final{position:fixed;inset:0;z-index:7;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:30px;background:radial-gradient(circle,rgba(60,10,40,.75),rgba(0,0,0,.92));
  opacity:0;pointer-events:none;transition:opacity 2s}
#final.on{opacity:1;pointer-events:auto}
#final h1{font-family:var(--script);font-size:clamp(44px,11vw,96px);line-height:1.1;
  background:linear-gradient(135deg,#ffd1e0,#ff5d8f,#ffb199);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 25px rgba(255,93,143,.6))}
#final p{font-family:var(--serif);font-style:italic;font-size:clamp(16px,3.5vw,24px);margin-top:16px;color:#ffd9e5;max-width:620px}
#final button{margin-top:30px;font:700 18px var(--script);padding:10px 28px;border-radius:40px;border:1px solid var(--rosa2);
  background:transparent;color:#fff;cursor:pointer}
#final button:hover{background:rgba(255,93,143,.25)}

/* calibración */
#calib{position:fixed;top:10px;left:10px;right:10px;z-index:20;background:rgba(0,0,0,.8);border:1px solid #ff5d8f;
  border-radius:10px;padding:10px 14px;font:14px/1.4 system-ui,sans-serif;display:none}
#calib textarea{width:100%;height:140px;margin-top:8px;background:#111;color:#9ff;border:1px solid #444;font:12px monospace}

#aviso{position:fixed;inset:auto 0 70px 0;z-index:30;text-align:center;color:#ffb3c7;font:14px system-ui;display:none}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<!-- ═══ CARTA ═══ -->
<div id="intro">
  <div class="scene" id="scene">
    <div class="env" id="env">
      <div class="atras"></div>
      <div class="carta">
        <h2>Para Monchis</h2>
        <p>Esta canción habla de nosotros</p>
        <span class="corazon">♥</span>
      </div>
      <div class="frente"></div>
      <div class="lado"></div><div class="lado der"></div>
      <div class="tapa"></div>
      <div class="sello">♥</div>
      <button id="btnAbrir">Para Monchis, haz click</button>
    </div>
  </div>
</div>

<!-- ═══ VENTANAS ═══ -->
<div id="stage"><div id="ventanas"></div></div>

<div id="controles">
  <button id="btnPlay" title="Pausa / Play">❚❚</button>
  <div id="barra"><i></i></div>
</div>

<div id="final">
  <h1 id="finalTitulo"></h1>
  <p id="finalTexto"></p>
  <button id="btnRepetir">Volver a verla ♥</button>
</div>

<div id="calib"></div>
<div id="aviso"></div>

<audio id="audio" preload="auto"></audio>

<script>
/* ═════════════════════════ CONFIGURACIÓN ═════════════════════════ */
const CONFIG = {
  audio:  "musica.mp3",     // sube tu canción con este nombre
  gif:    "corazon.gif",    // sube el gif con este nombre (480x362)
  titulo: "vinculo",
  finalTitulo: "Te amo, Monchis",
  finalTexto:  "Gracias por ser mi vínculo contigo, pdt: Saludos a rufo amor.",   // cámbialo por lo que quieras
};

/* ──────────────────────────────────────────────────────────────
   LETRA SINCRONIZADA
   t   = segundo en que aparece la línea
   fin = (opcional) segundo en que se cierra la ventana (para silencios)
   No incluyo la letra por derechos de autor: pégala tú.
   Para sacar los tiempos fácil abre la página con  ?calibrar
   (ejemplo: https://tuusuario.github.io/tu-repo/?calibrar)
   ────────────────────────────────────────────────────────────── */
const LETRA = [
  { t: 0.42, texto: "Si acaba el mundo hoy" },
  { t: 4.80, texto: "Si no sale el sol" },
  { t: 8.71, texto: "No importaría, pues" },
  { t: 11.92, texto: "Tu rostro puedo ver" },
  { t: 15.93, texto: "Tu risa es curativa" },
  { t: 19.33, texto: "De mi alma medicina" },
  { t: 22.84, texto: "Me haces compañía" },
  { t: 25.91, texto: "Por telepatía" },
  { t: 29.52, texto: "Si no estamos de frente" },
  { t: 32.83, texto: "Te veo de reojo" },
  { t: 37.37, texto: "En mi mente" }
  //{ t: 12.5, fin: 15, texto: "..." },
];

/* ═════════════════════════ ELEMENTOS ═════════════════════════ */
const $ = s => document.querySelector(s);
const audio = $("#audio"); audio.src = CONFIG.audio;
const contVentanas = $("#ventanas");
const CALIBRAR = new URLSearchParams(location.search).has("calibrar");
$("#finalTitulo").textContent = CONFIG.finalTitulo;
$("#finalTexto").textContent  = CONFIG.finalTexto;
// precarga del gif
const pre = new Image(); pre.src = CONFIG.gif;

/* ═════════════════════════ FONDO (estrellas + corazones) ═════════════════════════ */
const cv = $("#bg"), cx = cv.getContext("2d");
let W, H, estrellas = [], corazones = [];
function ajustar(){
  const d = Math.min(devicePixelRatio||1, 2);
  W = cv.width = innerWidth*d; H = cv.height = innerHeight*d;
  estrellas = Array.from({length: Math.round(innerWidth/6)}, () => ({
    x: Math.random()*W, y: Math.random()*H, r: (Math.random()*1.4+.3)*d, f: Math.random()*6.28, v: .5+Math.random()*1.5}));
}
addEventListener("resize", ajustar); ajustar();
function nuevoCorazon(x, y, grande){
  const d = Math.min(devicePixelRatio||1, 2);
  corazones.push({x: x ?? Math.random()*W, y: y ?? H+30*d, s:(grande? 14+Math.random()*22 : 6+Math.random()*14)*d,
    vy:(.4+Math.random()*1.1)*d*(grande?1.8:1), vx:(Math.random()-.5)*.6*d, a:grande?.9:.35+Math.random()*.3, o:Math.random()*6.28});
}
function dibujaCorazon(c){
  cx.save(); cx.translate(c.x, c.y); cx.scale(c.s/16, c.s/16); cx.globalAlpha = c.a;
  cx.fillStyle = "#ff5d8f"; cx.shadowColor = "#ff5d8f"; cx.shadowBlur = 12;
  cx.beginPath(); cx.moveTo(0,6);
  cx.bezierCurveTo(-18,-6,-8,-20,0,-8); cx.bezierCurveTo(8,-20,18,-6,0,6); cx.fill(); cx.restore();
}
let tBg = 0;
function fondo(){
  tBg += .016;
  cx.clearRect(0,0,W,H);
  for(const e of estrellas){
    cx.globalAlpha = .3 + .7*Math.abs(Math.sin(tBg*e.v + e.f));
    cx.fillStyle = "#ffe3ec"; cx.beginPath(); cx.arc(e.x,e.y,e.r,0,6.28); cx.fill();
  }
  if(Math.random() < .06) nuevoCorazon();
  corazones = corazones.filter(c => c.a > 0 && c.y > -60);
  for(const c of corazones){
    c.y -= c.vy; c.x += c.vx + Math.sin(tBg*2 + c.o)*.4;
    if(c.s > 20) c.a -= .006;
    dibujaCorazon(c);
  }
  requestAnimationFrame(fondo);
}
fondo();
function explosion(n=16){
  for(let i=0;i<n;i++) nuevoCorazon(W/2 + (Math.random()-.5)*W*.5, H/2 + (Math.random()-.3)*H*.3, true);
}

/* ═════════════════════════ VENTANAS ═════════════════════════ */
let ventanaActual = null;
const rnd = (a,b) => a + Math.random()*(b-a);

function crearVentana(i){
  const w = document.createElement("div");
  w.className = "win";
  const mx = innerWidth < 640 ? 10 : 70, my = innerWidth < 640 ? 25 : 45;
  w.style.setProperty("--dx", rnd(-mx,mx)+"px");
  w.style.setProperty("--dy", rnd(-my,my)+"px");
  w.style.setProperty("--rot", rnd(-2.2,2.2)+"deg");
  const palabras = LETRA[i].texto.split(" ").map((p,k) =>
    `<span style="animation-delay:${.25 + k*.09}s">${p}&nbsp;</span>`).join("");
  w.innerHTML = `
    <div class="titulo"><span>${CONFIG.titulo}</span><span class="cont">${i+1} / ${LETRA.length}</span><i class="x">×</i></div>
    <div class="cuerpo">
      <div class="gifbox"><img src="${CONFIG.gif}" alt=""></div>
      <div class="texto">${palabras}</div>
    </div>
    <div class="pie"><button class="ok">OK</button></div>`;
  contVentanas.appendChild(w);
  explosion(10);
  return w;
}
function cerrarVentana(w, rapido){
  if(!w) return;
  const ok = w.querySelector(".ok");
  if(rapido){ w.remove(); return; }
  ok.classList.add("pulsa");                 // "presiona" OK
  setTimeout(() => { w.classList.add("sale"); setTimeout(() => w.remove(), 450); }, 160);
}
function mostrarLinea(i){
  cerrarVentana(ventanaActual);
  ventanaActual = (i >= 0) ? crearVentana(i) : null;
}

/* ═════════════════════════ SINCRONIZACIÓN ═════════════════════════ */
let estado = -2, corriendo = false;
function indiceEn(t){
  let idx = -1;
  for(let i=0;i<LETRA.length;i++){ if(t >= LETRA[i].t) idx = i; else break; }
  if(idx >= 0 && LETRA[idx].fin && t >= LETRA[idx].fin) return -1;
  return idx;
}
function bucle(){
  if(!corriendo) return;
  if(!CALIBRAR){
    const idx = indiceEn(audio.currentTime);
    if(idx !== estado){ estado = idx; mostrarLinea(idx); }
  }
  if(audio.duration) $("#barra i").style.width = (audio.currentTime/audio.duration*100)+"%";
  requestAnimationFrame(bucle);
}
audio.addEventListener("ended", () => {
  corriendo = false; cerrarVentana(ventanaActual); ventanaActual = null;
  if(CALIBRAR) return;
  setTimeout(() => { $("#final").classList.add("on"); explosion(40); }, 900);
});
audio.addEventListener("error", () => {
  const a = $("#aviso"); a.style.display = "block";
  a.textContent = "No encuentro " + CONFIG.audio + " — súbelo a la misma carpeta que index.html";
});

/* ═════════════════════════ FLUJO: CARTA → NEGRO → CANCIÓN ═════════════════════════ */
function iniciar(){
  $("#intro").classList.add("negro");
  $("#stage").classList.add("on");
  $("#controles").classList.add("on");
  estado = -2; corriendo = true;
  audio.currentTime = 0;
  audio.play().catch(()=>{});
  bucle();
  if(CALIBRAR) iniciarCalibracion();
}
$("#btnAbrir").addEventListener("click", () => {
  $("#env").classList.add("abierta");
  explosion(14);
  // el click cuenta como gesto del usuario: "desbloqueamos" el audio ahora
  audio.muted = true; audio.play().then(() => { audio.pause(); audio.muted = false; audio.currentTime = 0; }).catch(()=>{ audio.muted = false; });
  setTimeout(() => $("#scene").classList.add("zoom"), 2300);
  setTimeout(iniciar, 3400);
});
$("#btnPlay").addEventListener("click", () => {
  if(audio.paused){ audio.play(); $("#btnPlay").textContent = "❚❚"; }
  else { audio.pause(); $("#btnPlay").textContent = "▶"; }
});
$("#btnRepetir").addEventListener("click", () => {
  $("#final").classList.remove("on");
  contVentanas.innerHTML = ""; ventanaActual = null;
  estado = -2; corriendo = true; audio.currentTime = 0; audio.play(); bucle();
});

/* ═════════════════════════ MODO CALIBRAR (?calibrar) ═════════════════════════
   Escucha la canción y pulsa ESPACIO (o toca la pantalla) justo cuando empieza cada línea.
   Al terminar te muestra el arreglo LETRA listo para copiar y pegar. */
function iniciarCalibracion(){
  const box = $("#calib"); box.style.display = "block";
  const marcas = []; let k = 0;
  const pinta = () => {
    box.innerHTML = k < LETRA.length
      ? `<b>MODO CALIBRAR</b> — Pulsa <b>ESPACIO</b> (o toca la pantalla) cuando empiece:<br>
         <span style="color:#ffb3c7;font-size:17px">«${LETRA[k].texto}»</span> (${k+1}/${LETRA.length})`
      : `<b>¡Listo!</b> Copia esto y reemplaza el arreglo LETRA:<textarea readonly id="salida"></textarea>`;
    if(k >= LETRA.length){
      $("#salida").value = "const LETRA = [\n" + LETRA.map((l,i) =>
        `  { t: ${marcas[i].toFixed(2)}, texto: ${JSON.stringify(l.texto)} },`).join("\n") + "\n];";
    }
  };
  const marcar = e => {
    if(k >= LETRA.length) return;
    if(e.type === "keydown" && e.code !== "Space") return;
    if(e.target.closest && e.target.closest("#calib, #controles")) return;
    e.preventDefault();
    marcas[k] = audio.currentTime;
    cerrarVentana(ventanaActual); ventanaActual = crearVentana(k);
    k++; pinta();
  };
  addEventListener("keydown", marcar); addEventListener("pointerdown", marcar);
  pinta();
}
</script>
</body>
</html>
